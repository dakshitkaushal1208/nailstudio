spring:
  application:
    name: cute-icles-backend
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cute_icles_app}?serverTimezone=UTC&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci
    username: ${DB_USERNAME:cuteicles}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate never changes it.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html


app:
  studio:
    timezone: ${STUDIO_TIMEZONE:Asia/Kolkata}

  jwt:
    secret: ${JWT_SECRET:}
    issuer: cute-icles-backend
    ttl-minutes: ${JWT_TTL_MINUTES:480}
    cookie-name: ci_session
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: Lax
    # When true the login response also carries "token" (for Swagger / PowerShell testing). Keep false in production.
    expose-token-in-body: false

  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173,http://localhost:5174,http://10.243.171.39:5173,http://192.168.1.17:5173}
    
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-bytes: 5242880

  security:

    login-max-failures: 5
    login-lock-minutes: 15
    reset-token-minutes: 30
    rate-limit:
      enabled: true
      auth-requests-per-minute: 20
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    admin-name: ${ADMIN_NAME:Studio Owner}
  payments:
    default-method: COD
    # TEST payments are a development convenience. They are rejected unless this is true.
    test-mode-enabled: false
  notifications:
    email-enabled: ${EMAIL_ENABLED:false}
    email-from: ${EMAIL_FROM:}
    # Development only: reset links are written to files here instead of the log. Leave empty in production.
    dev-outbox-dir: ""
    frontend-base-url: ${FRONTEND_ORIGIN_PRIMARY:http://localhost:5173}
