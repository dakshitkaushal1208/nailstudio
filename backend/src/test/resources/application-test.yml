spring:
  datasource:
    url: jdbc:h2:mem:cuteicles;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    hibernate:
      ddl-auto: none

app:
  jwt:
    secret: test-secret-test-secret-test-secret-123456
    expose-token-in-body: true
    cookie-secure: false
  upload:
    dir: ./target/test-uploads
  security:
    rate-limit:
      enabled: false
    login-max-failures: 3
  payments:
    test-mode-enabled: true
  notifications:
    dev-outbox-dir: ""
